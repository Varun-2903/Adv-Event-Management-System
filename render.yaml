services:
  - type: web
    name: event-management-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/events/public
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: event-management-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: event-management-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: event-management-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: https://event-management-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true

  - type: web
    name: event-management-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: event-management-api
          property: host

databases:
  - name: event-management-db
    plan: free
    databaseName: event_management
    user: event_management