spring.application.name=event-management-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/event_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=ThisIsADevelopmentSecretKeyChangeItBeforeProduction123456789
app.jwt.expiration=86400000

spring.jackson.serialization.write-dates-as-timestamps=false

# Razorpay Test Mode credentials: keep the secret on the backend only
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
